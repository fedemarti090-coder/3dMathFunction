<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VkGraph</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../node_modules/katex/dist/katex.min.css">
    <script type="importmap">
    {
        "imports": {
            "three": "./../node_modules/three/build/three.module.js",
            "three/addons/": "./../node_modules/three/examples/jsm/",
            "katex": "./../node_modules/katex/dist/katex.mjs"
        }
    }
</script>
</head>

<body>
    <main class="settings">
        <section class="panel controls-panel" aria-label="Impostazioni della funzione">
            <header class="brand">
                <img class="brand-logo" src="../../img/logo.png" alt="VkGraph">
            </header>

            <section class="function-section">
                <h1 class="section-title">funzione</h1>
                <label class="field-label" for="function-input">Inserisci una funzione in Latex</label>
                <input class="text-field" id="function-input" type="text" placeholder="function...">
                <div class="formula-preview" id="formula-preview" aria-label="Anteprima della formula LaTeX"
                    aria-live="polite"></div>
                <p class="allowed-signs">Segni accettabili: + - * / ^ sin() cos() tan()</p>
            </section>

            <section class="domain-section">
                <h2 class="section-title">dominio</h2>
                <div class="domain-fields">
                    <label for="domain-min">+</label>
                    <input class="text-field" id="domain-min" type="number" aria-label="Inizio del dominio">
                    <label for="domain-max">-</label>
                    <input class="text-field" id="domain-max" type="number" aria-label="Fine del dominio">
                </div>
                <label class="field-label step-label" for="function-step">Step della funzione</label>
                <input class="text-field" id="function-step" type="number" aria-label="Step della funzione">
            </section>

        </section>

        <section class="panel rotation-panel" aria-label="Rotazione e anteprima 3D">
            <section class="rotation-section">
                <h2 class="section-title">rotazione</h2>
                <div class="range-row">
                    <label for="rotation-x">X</label>
                    <input id="rotation-x" type="range" min="0" max="360" value="0">
                    <output class="range-value" id="rotation-x-value" for="rotation-x">0</output>
                </div>
                <div class="range-row">
                    <label for="rotation-y">Y</label>
                    <input id="rotation-y" type="range" min="0" max="360" value="0">
                    <output class="range-value" id="rotation-y-value" for="rotation-y">0</output>
                </div>
                <div class="range-row">
                    <label for="rotation-z">Z</label>
                    <input id="rotation-z" type="range" min="0" max="360" value="0">
                    <output class="range-value" id="rotation-z-value" for="rotation-z">0</output>
                </div>
                <button class="reset-button" type="button" id="reset-button">Reset</button>
                <div class="rotation-preview" role="img" aria-label="Anteprima 3D del triangolo RGB">
                    <canvas id="rotation-preview-canvas"></canvas>
                </div>
            </section>
            <section class="color-section">
                <h2 class="section-title">colore</h2>
                <div class="color-stops">
                    <label class="color-stop">
                        <input id="color-start" type="color" value="#0000ff" aria-label="Colore iniziale">
                    </label>
                    <label class="color-stop">
                        <input id="color-end" type="color" value="#ff0000" aria-label="Colore finale">
                    </label>
                </div>
                <div class="color-gradient" aria-hidden="true"></div>
                <div class="alpha-row">
                    <label for="alpha">A</label>
                    <input id="alpha" type="range" min="0" max="1" step="0.01" value="1">
                    <output class="range-value" id="alpha-value" for="alpha">1.00</output>
                </div>
            </section>
        </section>

        <section class="panel options-panel" aria-label="Assi cartesiani ed esempi">
            <section class="axes-section">
                <h2 class="section-title">Assi cartesiani</h2>
                <label class="check-row"><input id="axis-x" type="checkbox"><span>Asse x</span></label>
                <label class="check-row"><input id="axis-y" type="checkbox"><span>Asse y</span></label>
                <label class="check-row"><input id="axis-z" type="checkbox"><span>Asse z</span></label>
                <label class="check-row"><input id="zero-surfaces" type="checkbox"><span>Superfici di 0</span></label>
                <canvas class="axes-preview" id="axes-preview-canvas"
                    aria-label="Anteprima degli assi cartesiani e delle superfici a zero"></canvas>
            </section>

            <section class="examples-section">
                <h2 class="section-title">Esempi</h2>
                <div class="example-row"><span>Sella di Scimmia</span><button type="button" data-function="x^3-3*x*y^2">Prova</button></div>
                <div class="example-row"><span>Increspatura</span><button type="button" data-function="sin(x^2+y^2)">Prova</button></div>
                <div class="example-row"><span>Cartone delle Uova</span><button type="button" data-function="cos(x)+cos(y)">Prova</button></div>
                <div class="example-row"><span>Croce di Malta</span><button type="button" data-function="x*y/(x^2+y^2+0.1)">Prova</button></div>
                <div class="example-row"><span>Griglia di Asintoti</span><button type="button" data-function="tan(x)*tan(y)">Prova</button></div>
                <div class="example-row"><span>Scia a Spirale</span><button type="button" data-function="sin(x*y)/(1+x^2+y^2)">Prova</button></div>
            </section>
        </section>
    </main>
    <script type="module" src="renderer.js"></script>

    <script type="module" src="threejs/render-3drotation.js"></script>
    <script type="module" src="threejs/render-3daxes.js"></script>
</body>

</html>
